<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrafficVMS — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E63946;--dark:#0A0A0F;--card:#13131A;--border:#1E1E2E;--text:#E8E8F0;--muted:#6B6B88}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(230,57,70,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(230,57,70,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:600px;background:radial-gradient(ellipse,rgba(230,57,70,.12) 0%,transparent 70%);pointer-events:none}
.container{position:relative;z-index:1;width:100%;max-width:440px;padding:2rem}
.logo-area{text-align:center;margin-bottom:2rem}
.logo-icon{width:56px;height:56px;background:var(--red);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:.8rem;box-shadow:0 0 30px rgba(230,57,70,.35)}
.logo-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.2rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;margin-bottom:1.5rem;color:var(--text)}
.error-msg{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.3);color:#ff6b7a;padding:.8rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1.2rem}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;font-weight:500}
input,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;transition:all .2s}
input:focus,select:focus{outline:none;border-color:var(--red);background:rgba(230,57,70,.05);box-shadow:0 0 0 3px rgba(230,57,70,.1)}
input::placeholder{color:var(--muted)}
select option{background:#1a1a2e}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.role-card{border:2px solid var(--border);border-radius:10px;padding:1rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.role-card:hover{border-color:rgba(230,57,70,.5)}
.role-card input[type=radio]{position:absolute;opacity:0}
.role-card.active{border-color:var(--red);background:rgba(230,57,70,.08)}
.role-icon{font-size:1.5rem;margin-bottom:.4rem}
.role-name{font-size:.85rem;font-weight:600}
.role-desc{font-size:.7rem;color:var(--muted);margin-top:.2rem}
.btn{width:100%;padding:.95rem;background:var(--red);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:.8rem}
.btn:hover{background:#c62d39;transform:translateY(-1px);box-shadow:0 8px 25px rgba(230,57,70,.4)}
.login-link{text-align:center;margin-top:1.2rem;color:var(--muted);font-size:.85rem}
.login-link a{color:var(--red);text-decoration:none}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">🚦</div>
    <div class="logo-title">TrafficVMS</div>
  </div>
  <div class="card">
    <h2>Create Account</h2>
    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST" id="regForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 6 characters" required>
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <div class="role-grid">
          <div class="role-card active" id="card-user" onclick="selectRole('user')">
            <input type="radio" name="role" value="user" id="r-user" checked>
            <div class="role-icon">👤</div>
            <div class="role-name">Citizen</div>
            <div class="role-desc">View & pay fines</div>
          </div>
          <div class="role-card" id="card-police" onclick="selectRole('police')">
            <input type="radio" name="role" value="police" id="r-police">
            <div class="role-icon">🚓</div>
            <div class="role-name">Police Officer</div>
            <div class="role-desc">Issue violations</div>
          </div>
        </div>
      </div>
      <button class="btn" type="submit">Create Account →</button>
    </form>
    <div class="login-link">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>
<script>
function selectRole(role){
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('card-'+role).classList.add('active');
  document.getElementById('r-'+role).checked=true;
}
</script>
</body>
</html>
